<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер товарів</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Менеджер товарів</h1>

        <!-- Форма для додавання/редагування (Create / Update) -->
        <form id="product-form" class="card">
            <div class="form-group">
                <label for="name">Назва товару:</label>
                <input type="text" id="name" required placeholder="Введіть назву...">
            </div>
            <div class="form-group">
                <label for="price">Ціна (₴):</label>
                <input type="number" id="price" min="0" step="0.01" required placeholder="0.00">
            </div>
            <div class="form-group">
                <label for="description">Опис:</label>
                <textarea id="description" rows="3" required placeholder="Короткий опис товару..."></textarea>
            </div>
            <div class="form-actions">
                <button type="submit" id="submit-btn">Додати товар</button>
                <button type="button" id="cancel-btn" class="hidden">Скасувати</button>
            </div>
        </form>

        <!-- Таблиця для виведення даних (Read / Delete) -->
        <div class="products-list">
            <h2>Список товарів</h2>
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Назва</th>
                            <th>Ціна</th>
                            <th>Опис</th>
                            <th>Дії</th>
                        </tr>
                    </thead>
                    <tbody id="products-body">
                        <!-- Сюди товари додаватимуться динамічно -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Підключаємо скомпільований JS файл -->
    <script src="app.js"></script>
</body>

</html>
